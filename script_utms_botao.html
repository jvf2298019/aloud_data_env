<script>
  document.addEventListener("DOMContentLoaded", function() {
    console.log("🟢 Script de UTMs iniciado.");
  
    // Função para pegar as UTMs da URL
    function getUTMs() {
      const params = new URLSearchParams(window.location.search);
      const utmKeys = ["utm_source", "utm_campaign", "utm_content", "utm_medium", "campaign_id"];
      const utms = {};
      utmKeys.forEach(key => {
        const value = params.get(key);
        if (value) utms[key] = value;
      });
      return utms;
    }
  
    const utms = getUTMs();
  
    if (Object.keys(utms).length === 0) {
      console.log("⚪ Nenhuma UTM encontrada na URL.");
      return;
    }
  
    console.log("🔹 UTMs detectadas:", utms);
  
    // Monta o valor do sck no formato solicitado
    const sckValue = [
      `utm_source=${utms.utm_source || ""}`,
      `utm_campaign=${utms.utm_campaign || ""}`,
      `utm_content=${utms.utm_content || ""}`,
      `utm_medium=${utms.utm_medium || ""}`,
      `campaign_id=${utms.campaign_id || "lcto-bf25-leads"}`
    ].join("%26");
  
    console.log("🧩 Valor final de sck:", sckValue);
  
    // Seleciona todos os links da Hotmart
    const hotmartLinks = Array.from(document.querySelectorAll("a[href*='pay.hotmart']"));
  
    if (hotmartLinks.length === 0) {
      console.log("⚪ Nenhum link contendo 'pay.hotmart' encontrado na página.");
      return;
    }
  
    console.log(`🔍 ${hotmartLinks.length} link(s) Hotmart encontrado(s). Atualizando...`);
  
  hotmartLinks.forEach((link, i) => {
    const originalHref = link.href;
    let baseUrl = originalHref.split('?')[0]; // tudo antes do '?'
  
    // Remove sck antigo, se existir
    let params = originalHref.includes('?')
      ? originalHref.split('?')[1].split('&').filter(p => !p.startsWith('sck='))
      : [];
  
    // Adiciona o novo sck
    params.push(`sck=${sckValue}`);
  
    const newHref = `${baseUrl}?${params.join('&')}`;
    link.setAttribute('href', newHref);
  
    console.log(`✅ [${i + 1}] Link atualizado:`);
    console.log("   Original:", originalHref);
    console.log("   Novo:", newHref);
  });
  
    console.log("🏁 Atualização de UTMs concluída com sucesso.");
  });
  </script>
